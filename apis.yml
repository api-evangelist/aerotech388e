aid: aerotech388e
name: Aerotech (Beijing)
description: >-
  Aerotech — 中科艾尔（北京）科技有限公司, Zhongke Aier (Beijing) Technology Co., Ltd., founded in March 2008 as
  泰科爱尔（北京）科技有限公司 (Taike Aier) with a Japanese engineering team — is a Beijing semiconductor
  components manufacturer that researches, produces and sells ultra-high-purity gas line tube and valve
  hardware: UHP pressure regulators, diaphragm valves, bellows and vacuum angle valves, ball and check
  valves, EP/BA electropolished stainless tubing and fittings, integrated gas distribution panels,
  measurement devices and precursor source bottles. The company developed its own EP (electrolytic
  polishing) process in 2009 and its own industrial electropolishing equipment in 2012, joined the MIIT
  domestic-substitution program piloted at SMIC in 2018, opened a 10,969 m² class-10 cleanroom plant in
  the Cangzhou Bohai New Area in September 2020 on a RMB 230M investment, and became a qualified SMIC
  (中芯国际) supplier in March 2021. Its product is physical hardware for semiconductor fab gas delivery;
  it operates no developer program, no public API, no SDK and no machine-readable API contract.
